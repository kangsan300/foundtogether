        function handleAnswerClick(event) {
            const option = event.currentTarget;
            const questionCard = option.closest('.question-card');
            const questionId = questionCard.id.split('-')[1];
            const value = option.dataset.value;
            
            // 같은 질문의 다른 옵션들 선택 해제
            questionCard.querySelectorAll('.answer-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // 현재 옵션 선택
            option.classList.add('selected');
            
            // 답변 저장
            answers[questionId] = parseInt(value);
            
            // 진행률 업데이트
            updateProgress();
        }

        function fillMissingAnswers() {
            questions.forEach(q => {
                if (!answers[q.id]) {

                    answers[q.id] = randomValue;
                }

        function generateSurveyQuestions() {
            const container = document.getElementById('survey-questions');
            let questionsHTML = '';
            
            questions.forEach((question) => {
                questionsHTML += `
                    <div class="question-card" id="question-${question.id}" data-category="${question.category}" data-weight="${question.weight}">
                        <h3 class="text-lg font-bold mb-4 text-gray-800">
                            ${question.id}. ${question.text}
                        </h3>
                        <div class="flex flex-wrap">
                            ${[1,2,3,4,5].map(value => `
                                <label class="answer-option flex-1 min-w-0 cursor-pointer" data-value="${value}">

                                        <div class="font-semibold">${value}</div>
                                        <div class="text-xs text-gray-600 mt-1">
                                            ${value === 1 ? '전혀 아니다' : value === 2 ? '아니다' : value === 3 ? '보통' : value === 4 ? '그렇다' : '매우 그렇다'}
                                        </div>
                                    </div>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML += questionsHTML;

            // 모든 답변 옵션에 이벤트 리스너 추가
            document.querySelectorAll('.answer-option').forEach(option => {
                option.addEventListener('click', handleAnswerClick);
            });
            
            // 모든 질문 카드가 보이도록 설정 (PC 환경 최적화)
            document.getElementById('survey-questions').style.display = 'block';
            document.getElementById('results-section').classList.add('hidden');
        }

        function validatePersonalInfo() {
            const required = ['userName', 'userPhone', 'ageGroup', 'businessExp', 'investment', 'workTime'];
            return required.every(id => document.getElementById(id).value.trim() !== '');
        }

        function updateProgress() {
            const answeredCount = Object.keys(answers).length;
            const percentage = (answeredCount / questions.length) * 100;
            
            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('progress-text').textContent = `${answeredCount}/${questions.length} 문항`;

            // 프로그레스 바 색상 변경 로직 추가 (선택적)
            const progressBar = document.getElementById('progress-bar');
            if (percentage < 30) {
                progressBar.style.backgroundColor = 'rgba(239, 68, 68, 0.8)'; // Red
            } else if (percentage < 70) {
                progressBar.style.backgroundColor = 'rgba(245, 158, 11, 0.8)'; // Yellow
            } else {
                progressBar.style.backgroundColor = 'rgba(59, 130, 246, 0.8)'; // Blue
            }
        }

        async function startAnalysis() {
            // 개인 정보 저장
            personalInfo = {
                name: document.getElementById('userName').value,
                phone: document.getElementById('userPhone').value,
                age: document.getElementById('ageGroup').value,
                experience: document.getElementById('businessExp').value,
                investment: document.getElementById('investment').value,
                workTime: document.getElementById('workTime').value
            };
            
            // UI 전환 및 로딩 모달 표시
            document.getElementById('personal-info-section').style.display = 'none';
            document.getElementById('survey-questions').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('loading-modal').style.display = 'block';
            
            // 진행률 애니메이션
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 95) progress = 95;
                document.getElementById('analysis-progress').style.width = progress + '%';
            }, 200);

        function performAnalysis() {
            // 성향별 점수 계산 (가중치 적용)
            const categoryScores = {
                adventure: 0,
                independence: 0,
                stability: 0,
                diligence: 0,
                sociability: 0
            };

            const categoryCounts = {
                adventure: 0,
                independence: 0,
                stability: 0,
                diligence: 0,
                sociability: 0
            };

            // 각 답변에 대해 점수 계산
            Object.entries(answers).forEach(([questionId, answer]) => {
                const question = questions.find(q => q.id === parseInt(questionId));
                if (question) {
                    const score = answer * question.weight;
                    categoryScores[question.category] += score;
                    categoryCounts[question.category]++;
                }
            });

            // 평균 점수 계산 (1-5 스케일로 정규화)
            const normalizedScores = {};
            Object.keys(categoryScores).forEach(category => {
                normalizedScores[category] = categoryCounts[category] > 0 ? categoryScores[category] / categoryCounts[category] : 0;
            });

            // 개인정보 기반 가중치 적용
            applyPersonalWeights(normalizedScores);

            // 업종별 적합도 계산
            const industryScores = calculateIndustryScores(normalizedScores);

            // 결과 저장
            analysisResult = {
                personalityScores: normalizedScores,
                industryScores: industryScores,
                personalInfo: personalInfo,
                timestamp: new Date().toISOString()
            };
        }

        function applyPersonalWeights(scores) {
            // 연령대별 가중치
            const ageWeights = {
                '20s': { adventure: 1.2, independence: 1.1, stability: 0.8, diligence: 0.9, sociability: 1.1 },
                '30s': { adventure: 1.0, independence: 1.1, stability: 1.0, diligence: 1.1, sociability: 1.0 },
                '40s': { adventure: 0.9, independence: 1.0, stability: 1.1, diligence: 1.2, sociability: 1.0 },
                '50s': { adventure: 0.7, independence: 0.9, stability: 1.3, diligence: 1.3, sociability: 0.9 },
                '60s': { adventure: 0.6, independence: 0.8, stability: 1.4, diligence: 1.3, sociability: 0.8 }
            };

            // 경험별 가중치
            const expWeights = {
                'none': { adventure: 0.8, independence: 0.8, stability: 1.2, diligence: 1.1, sociability: 1.0 },
                'once': { adventure: 1.0, independence: 1.0, stability: 1.0, diligence: 1.1, sociability: 1.0 },
                'multiple': { adventure: 1.2, independence: 1.2, stability: 0.9, diligence: 1.0, sociability: 1.1 },
                'professional': { adventure: 1.3, independence: 1.3, stability: 0.8, diligence: 1.2, sociability: 1.2 }
            };

            // 가중치 적용
            const ageWeight = ageWeights[personalInfo.age] || {};
            const expWeight = expWeights[personalInfo.experience] || {};

            Object.keys(scores).forEach(category => {
                scores[category] *= (ageWeight[category] || 1.0) * (expWeight[category] || 1.0);
                // 1-5 범위로 클리핑
                scores[category] = Math.max(1, Math.min(5, scores[category]));
            });
        }

        function calculateIndustryScores(userScores) {
            const results = [];
            const userVector = {
                adventure: userScores.adventure / 5,
                independence: userScores.independence / 5,
                stability: userScores.stability / 5,
                diligence: userScores.diligence / 5,
                sociability: userScores.sociability / 5
            };
            Object.entries(franchiseIndustries).forEach(([industry, profile]) => {
                const similarity = calculateCosineSimilarity(userVector, profile);
                
                let personalBonus = 0;
                
                if (personalInfo.investment === profile.investment) {
                    personalBonus += 0.1;
                }
                if (personalInfo.experience === 'professional') {
                    personalBonus += 0.05;
                }

                // 새로운 스케일링 수식 적용
                const finalScore = Math.min(100, Math.max(0, similarity * 100 + personalBonus * 100));

                results.push({
                    industry: industry,
                    score: finalScore,
                    risk: profile.risk,
                    profitability: profile.profitability,
                    investment: profile.investment
                });
            });

            return results.sort((a, b) => b.score - a.score);
        }

        function calculateCosineSimilarity(vecA, vecB) {
            const keys = ['adventure', 'independence', 'stability', 'diligence', 'sociability'];
            
            let dotProduct = 0;
            let normA = 0;
            let normB = 0;

            keys.forEach(key => {
                const a = vecA[key] || 0;
                const b = vecB[key] || 0;
                dotProduct += a * b;
                normA += a * a;
                normB += b * b;
            });

            return normA === 0 || normB === 0 ? 0 : dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
        }

                const selectedData = dataList.find(item => item.id === id);

                if (!selectedData) {
                    showCustomAlert('알림', '선택된 데이터를 찾을 수 없습니다.');

                const answersToLoad = typeof selectedData.answers === 'string' ? JSON.parse(selectedData.answers) : selectedData.answers;
                const analysisToLoad = typeof selectedData.analysis_result === 'string' ? JSON.parse(selectedData.analysis_result) : selectedData.analysis_result;

                answers = answersToLoad;
                personalInfo = {
                    name: selectedData.user_name,
                    phone: selectedData.user_phone,
                    age: analysisToLoad.personalInfo.age,
                    experience: analysisToLoad.personalInfo.experience,
                    investment: analysisToLoad.personalInfo.investment,
                    workTime: analysisToLoad.personalInfo.workTime
                };
                analysisResult = analysisToLoad;

                document.getElementById('userName').value = personalInfo.name;
                document.getElementById('userPhone').value = personalInfo.phone;
                document.getElementById('ageGroup').value = personalInfo.age;
                document.getElementById('businessExp').value = personalInfo.experience;
                document.getElementById('investment').value = personalInfo.investment;
                document.getElementById('workTime').value = personalInfo.workTime;
                
                document.querySelectorAll('.answer-option').forEach(option => {
                    option.classList.remove('selected');
                });
                for (const qId in answers) {
                    const selectedValue = answers[qId];
                    const questionCard = document.querySelector(`#question-${qId}`);
                    if (questionCard) {
                        const option = questionCard.querySelector(`[data-value="${selectedValue}"]`);
                        if (option) {
                            option.classList.add('selected');
                        }
                    }
                }
                
                updateProgress();
                showResults();

                showCustomAlert('알림', '이전 결과를 성공적으로 불러왔습니다!');

                console.error("Error parsing loaded data:", e);

        }

                document.getElementById('businessExp').value = '';
                document.getElementById('investment').value = '';
                document.getElementById('workTime').value = '';

                // 답변 초기화
                document.querySelectorAll('.answer-option').forEach(option => {
                    option.classList.remove('selected');
                });

                // 진행률 초기화
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('progress-text').textContent = `0/${questions.length} 문항`;

                // UI 초기화
                document.getElementById('personal-info-section').style.display = 'block';
                document.getElementById('survey-questions').style.display = 'block';
                document.getElementById('results-section').classList.add('hidden');
                document.getElementById('action-buttons').style.display = 'block';

                // 모든 질문 카드가 보이도록 설정
                document.querySelectorAll('.question-card').forEach(card => {
                    card.style.display = 'block';
                });
            });
        }

        function printResults() {
            if (!analysisResult) {
                showCustomAlert('알림', '출력할 결과가 없습니다.');
                return;
            }

            // 새 창에서 인쇄용 페이지 생성
            const printWindow = window.open('', '_blank');
            const printContent = generatePrintContent();
            
            printWindow.document.write(printContent);
            printWindow.document.close();
            printWindow.focus();
            
            setTimeout(() => {
                printWindow.print();
            }, 250);
        }

        function generatePrintContent() {
            const topRecommendations = analysisResult.industryScores.slice(0, 10);
            const scores = analysisResult.personalityScores;
            
            return `
                <!DOCTYPE html>
                <html lang="ko">
                <head>
                    <meta charset="UTF-8">
                    <title>프랜차이즈 창업 성향분석 결과</title>
                    <style>
                        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; }
                        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
                        .section { margin-bottom: 30px; }
                        .section h3 { background-color: #f5f5f5; padding: 10px; margin: 0 0 15px 0; }
                        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                        th { background-color: #f2f2f2; }
                        .score { font-weight: bold; color: #2563eb; }
                        @media print { body { margin: 0; } }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>프랜차이즈 창업 성향분석 결과</h1>
                        <p>분석일시: ${new Date(analysisResult.timestamp).toLocaleString('ko-KR')}</p>
                        <p>대상자: ${personalInfo.name} (${personalInfo.age}, 경험: ${personalInfo.experience})</p>
                    </div>

                    <div class="section">
                        <h3>성향 분석 결과</h3>
                        <table>
                            <tr><th>성향</th><th>점수</th><th>평가</th></tr>
                            <tr><td>모험심</td><td class="score">${scores.adventure.toFixed(1)}/5.0</td><td>${getScoreDescription(scores.adventure)}</td></tr>
                            <tr><td>독립성</td><td class="score">${scores.independence.toFixed(1)}/5.0</td><td>${getScoreDescription(scores.independence)}</td></tr>
                            <tr><td>안정성</td><td class="score">${scores.stability.toFixed(1)}/5.0</td><td>${getScoreDescription(scores.stability)}</td></tr>
                            <tr><td>성실성</td><td class="score">${scores.diligence.toFixed(1)}/5.0</td><td>${getScoreDescription(scores.diligence)}</td></tr>
                            <tr><td>사교성</td><td class="score">${scores.sociability.toFixed(1)}/5.0</td><td>${getScoreDescription(scores.sociability)}</td></tr>
                        </table>
                    </div>

                    <div class="section">
                        <h3>추천 업종 (상위 10개)</h3>
                        <table>
                            <tr><th>순위</th><th>업종</th><th>적합도</th><th>위험도</th><th>수익성</th><th>투자규모</th></tr>
                            ${topRecommendations.map((item, index) => `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td>${item.industry}</td>
                                    <td class="score">${item.score.toFixed(1)}%</td>
                                    <td>${item.risk}</td>
                                    <td>${(item.profitability * 100).toFixed(0)}%</td>
                                    <td>${item.investment}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>

                    <div class="section">
                        <h3>종합 의견</h3>
                        <p>본 분석 결과는 설문 응답을 바탕으로 한 참고 자료입니다. 실제 창업 시에는 시장 조사, 자금 계획, 입지 분석 등 추가적인 검토가 필요합니다.</p>
                    </div>
                </body>
                </html>
            `;
        }

        function getScoreDescription(score) {
            if (score >= 4.0) return '매우 높음';
            if (score >= 3.5) return '높음';
            if (score >= 2.5) return '보통';
            if (score >= 2.0) return '낮음';
            return '매우 낮음';
        }

        // 차트 업데이트를 위한 Chart.js 기본 설정
        Chart.defaults.font.family = "'Noto Sans KR', sans-serif";
        Chart.defaults.color = '#4b5563';

        // 반응형 처리
        window.addEventListener('resize', function() {
            // 차트 리사이즈는 Chart.js가 자동으로 처리
        });

        // 키보드 네비게이션 지원
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && currentQuestion > 0 && currentQuestion <= 45) {
                // 현재 질문에서 선택된 답변이 있으면 다음으로
                const currentCard = document.getElementById(`question-${currentQuestion}`);
                if (currentCard && currentCard.querySelector('.answer-option.selected')) {
                    nextQuestion();
                }
            }
        });
    </script>
</body>
</html>
